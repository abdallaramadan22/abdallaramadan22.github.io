<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>توزيع المجموعات - عشوائي</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:sans-serif; }
body { background:#0f0f0f; color:#fff; text-align:center; padding:20px; }
h1 { font-size:28px; margin-bottom:5px; }
p { color:#aaa; margin-bottom:20px; }
button { background:#25D366; color:#fff; border:none; padding:15px 30px; border-radius:50px; font-size:20px; font-weight:bold; cursor:pointer; margin-bottom:20px; }
.groups { display:flex; gap:15px; flex-wrap:wrap; justify-content:center; }
.group { background:#1c1c1c; border-radius:15px; padding:20px; width:100%; max-width:320px; text-align:right; }
.group h2 { text-align:center; margin-bottom:15px; color:#25D366; }
.group div { background:#2a2a2a; padding:12px; border-radius:10px; margin-bottom:8px; font-size:18px; }
.prizes { margin-top:30px; background:#1c1c1c; border-radius:15px; padding:20px; max-width:660px; margin-left:auto; margin-right:auto; }
.prizes h2 { color:#FFD700; margin-bottom:15px; font-size:24px; }
.prizes-grid { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
.prize-card { background:#2a2a2a; border-radius:12px; padding:10px; width:48%; max-width:300px; }
.prize-card img { width:100%; height:180px; object-fit:cover; border-radius:10px; }
.prize-card b { display:block; margin-top:8px; font-size:17px; }
.prize-card span { color:#FFD700; font-size:15px; }
</style>
</head>
<body>
<h1>⚽ توزيع المجموعات</h1>
<p>اضغط على الزرار وهيوزع اللاعيبة عشوائي كل مرة</p>
<button onclick="distribute()">🔀 وزع عشوائي</button>
<div class="groups">
  <div class="group"><h2>المجموعة A</h2><div id="groupA"></div></div>
  <div class="group"><h2>المجموعة B</h2><div id="groupB"></div></div>
</div>
<div class="prizes">
  <h2>🏆 الجوائز</h2>
  <div class="prizes-grid">
    <div class="prize-card"><img src="prize1.jpg"><b>🥇 المركز الأول</b><span>اكتب اسم الجائزة هنا</span></div>
    <div class="prize-card"><img src="prize2.jpg"><b>🥈 المركز الثاني</b><span>اكتب اسم الجائزة هنا</span></div>
    <div class="prize-card"><img src="prize3.jpg"><b>🥉 المركز الثالث</b><span>اكتب اسم الجائزة هنا</span></div>
    <div class="prize-card"><img src="prize4.jpg"><b>⭐ أفضل لاعب</b><span>اكتب اسم الجائزة هنا</span></div>
  </div>
</div>
<script>
let players = ["عمر يسري","يوسف صبري","عمر احمد تاج","محمد رمضان","لاعب جديد 1","لاعب جديد 2"];
function shuffle(arr){ let a=[...arr]; for(let i=a.length-1;i>0;i--){ let j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function distribute(){ let s=shuffle(players); let h=Math.ceil(s.length/2); document.getElementById("groupA").innerHTML=s.slice(0,h).map(p=>`<div>${p}</div>`).join(""); document.getElementById("groupB").innerHTML=s.slice(h).map(p=>`<div>${p}</div>`).join(""); }
distribute();
</script>
</body>
</html>
